<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/popup.css">
  <link rel="stylesheet" href="src/addLocation.css">
  <title>Document</title>
</head>
<body>
    <!-- Карта -->
  <div id="container"></div>

  <!-- Меню -->
  <div>
    <div id="bottom-menu" style="height: 60px;">
      <div class="menu-item">
        <svg xmlns="http://www.w3.org/2000/svg" width="6vw" height="6vw" fill="currentColor">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
        </svg>
      </div>
      <button id="open-form-btn" class="menu-item floating-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="6vw" height="6vw" fill="currentColor">
          <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
        </svg>
      </button>
      <button class="menu-item">
        <a href="./page/lk.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="6vw" height="6vw" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>

        </a>
      </button>
    </div>
  </div>

  <!-- Всплывающее окно для выбора категории локации -->
  <div id="filter-overlay" class="category-filter-overlay hidden">
    <div id="filter-modal" class="category-filter-modal">
      <h3>Выберите категорию</h3>
      <select id="location-type-modal"></select>

      <h4>Фильтры</h4>
      <div id="filters-modal"></div>

      <button id="close-filter-modal">Закрыть</button>
      <button id="apply-filters">Применить</button>
    </div>
  </div>



  <!-- Всплывающее окно для добавления локации -->
  <div id="location-modal">
    <form id="add-location-form">

      <div class="photo-upload">
        <label for="photo-input">Загрузить фото</label>
        <label class="custom-file-input" for="photo-input">Выбрать файлы</label>
        <input type="file" id="photo-input" accept="image/*" multiple />
        <div id="photo-preview" class="preview-container"></div>
      </div>
      <div>
        
        
        <div class="location-input">
          <label for="address">Адрес</label>
          <input type="text" id="address" name="address" placeholder="Введите адрес или выберите на карте" autocomplete="off"/>
          <ul id="address-suggestions" class="suggestions-list"></ul>
          <div id="map" style="height: 60vw; width: 100%; border-radius: 3vw; overflow: hidden;"></div>
        </div>
        
      <div class="select-wrapper">
        <label for="location-type">Тип локации</label>
        <select id="location-type" name="locationType"></select>
      </div>

      <div class="filters-wrapper">
        <div id="filters"></div>
      </div>
      
      <div>
        <label for="description">Описание</label>
        <textarea id="description" name="description" placeholder="Опишите место..."></textarea>
      </div>

      <div>
        <label for="directions">Как добраться</label>
        <textarea id="directions" name="directions" placeholder="Напишите, как найти место..."></textarea>
      </div>

      <div class="rating-wrapper">
        <label>Оцените:</label>
        <div>
          <span>Чистота</span>
          <div class="stars">
            <input type="radio" id="clean-5" name="cleanliness" value="5"><label for="clean-5">★</label>
            <input type="radio" id="clean-4" name="cleanliness" value="4"><label for="clean-4">★</label>
            <input type="radio" id="clean-3" name="cleanliness" value="3"><label for="clean-3">★</label>
            <input type="radio" id="clean-2" name="cleanliness" value="2"><label for="clean-2">★</label>
            <input type="radio" id="clean-1" name="cleanliness" value="1"><label for="clean-1">★</label>
          </div>
        </div>
        <div>
          <span>Удобство</span>
          <div class="stars">
            <input type="radio" id="conv-5" name="convenience" value="5"><label for="conv-5">★</label>
            <input type="radio" id="conv-4" name="convenience" value="4"><label for="conv-4">★</label>
            <input type="radio" id="conv-3" name="convenience" value="3"><label for="conv-3">★</label>
            <input type="radio" id="conv-2" name="convenience" value="2"><label for="conv-2">★</label>
            <input type="radio" id="conv-1" name="convenience" value="1"><label for="conv-1">★</label>
          </div>
        </div>
        <div>
          <span>Другое</span>
          <div class="stars">
            <input type="radio" id="other-5" name="other" value="5"><label for="other-5">★</label>
            <input type="radio" id="other-4" name="other" value="4"><label for="other-4">★</label>
            <input type="radio" id="other-3" name="other" value="3"><label for="other-3">★</label>
            <input type="radio" id="other-2" name="other" value="2"><label for="other-2">★</label>
            <input type="radio" id="other-1" name="other" value="1"><label for="other-1">★</label>
          </div>
        </div>
      </div>
      <button class="moder-btn" type="submit">Отправить на модерацию</button>
    </form>
  </div>

  <script type="module" src="./src/index.js"></script>
  <!-- скрипт для заполнения формы -->
  <!-- Временноый скрипт вызова формы 
  <script>

  </script>
  -->
</body>
</html>
