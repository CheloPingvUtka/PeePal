<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Document</title>
</head>
<body>
    <div id="container"></div>
    <div>
        <div id="bottom-menu">
            <div class="menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/>
                </svg>
                <!--<span>Маршрут</span>-->
            </div>
            <button id="open-form-btn" class="menu-item floating-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor">
                    <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                </svg>
                <!--<span>Новое место</span>-->
            </button>
            <div class="menu-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <!--<span>Личный кабинет</span>-->
            </div>
        </div>
    </div>


    <div id="location-modal" class="modal hidden">

        <form id="add-location-form">
            <!-- Загрузка фото -->
            <div class="photo-upload">
              <label for="photo-input">Загрузить фото</label>
              <input type="file" id="photo-input" accept="image/*" multiple />
              <div id="photo-preview"></div>
            </div>
          
            <!-- Адрес -->
            <div class="location-input">
              <label for="address">Адрес</label>
              <input type="text" id="address" name="address" placeholder="Введите адрес или выберите на карте" />
              <div id="map"></div>
            </div>
          
            <!-- Тип локации -->
            <div class="select-wrapper">
              <label for="location-type">Тип локации</label>
              <select id="location-type" name="locationType">
                <!-- варианты подтягиваются с бэка -->
              </select>
            </div>
          
            <!-- Фильтры -->
            <div class="filters-wrapper">
              <label>Фильтры</label>
              <div id="filters">
                <!-- чекбоксы с фильтрами от бэкенда -->
              </div>
            </div>
          
            <!-- Описание -->
            <div>
              <label for="description">Описание</label>
              <textarea id="description" name="description" placeholder="Опишите место..."></textarea>
            </div>
          
            <!-- Как добраться -->
            <div>
              <label for="directions">Как добраться</label>
              <textarea id="directions" name="directions" placeholder="Напишите, как найти место..."></textarea>
            </div>
          
            <!-- Оценка по критериям -->
            <div class="rating-wrapper">
              <label>Оцените:</label>
              <div>
                <span>Чистота</span>
                <input type="range" name="cleanliness" min="1" max="5" />
              </div>
              <div>
                <span>Удобство</span>
                <input type="range" name="convenience" min="1" max="5" />
              </div>
              <div>
                <span>Другое</span>
                <input type="range" name="other" min="1" max="5" />
              </div>
            </div>
          
            <button type="submit">Отправить на модерацию</button>
        </form>
    </div>
    
    <!-- Пример карточки локации -->
    

    <script type="module" src="./src/index.js"></script>
</body>
</html>
